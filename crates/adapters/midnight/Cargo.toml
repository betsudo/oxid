[package]
name = "oxid-adapter-midnight"
description = "Midnight network, address, and account read-model adapters for Oxid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
proving-bench = []
mixed-era-replay = [
  "dep:midnight-legacy-ledger",
  "dep:midnight-legacy-serialize",
  "dep:midnight-legacy-storage",
  "dep:midnight-legacy-storage-core",
  "dep:midnight-legacy-zswap",
  "dep:midnight-legacy-coin-structure",
]

[[example]]
name = "local-proving"
required-features = ["proving-bench"]

[dependencies]
bech32.workspace = true
hex.workspace = true
oxid-adapter-store-atomic.workspace = true
oxid-adapter-platform-system.workspace = true
oxid-foundation.workspace = true
oxid-diagnostics-application.workspace = true
oxid-platform-ports.workspace = true
oxid-wallet-application.workspace = true
oxid-wallet-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true
futures.workspace = true
futures-timer.workspace = true
midnight-base-crypto.workspace = true
midnight-coin-structure.workspace = true
midnight-ledger = { workspace = true, features = ["proving"] }
midnight-legacy-coin-structure = { package = "midnight-coin-structure", version = "=2.0.2", optional = true }
midnight-legacy-ledger = { package = "midnight-ledger", version = "=8.1.3", default-features = false, optional = true }
midnight-legacy-serialize = { package = "midnight-serialize", version = "=1.1.1", optional = true }
midnight-legacy-storage = { package = "midnight-storage", version = "=2.0.3", optional = true }
# Ledger 8.1.3 pairs storage 2.0.3 with storage-core 1.2.1's digest trait.
midnight-legacy-storage-core = { package = "midnight-storage-core", version = "=1.2.1", optional = true }
midnight-legacy-zswap = { package = "midnight-zswap", version = "=8.1.3", default-features = false, optional = true }
midnight-onchain-runtime.workspace = true
midnight-serialize.workspace = true
midnight-storage.workspace = true
midnight-transient-crypto.workspace = true
midnight-zkir.workspace = true
midnight-zkir-v2.workspace = true
midnight-zswap.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustls.workspace = true
subxt.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27"
